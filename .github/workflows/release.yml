name: Release

# Publishes a GitHub release whenever the SYSCOM version in versions.json changes on main: merging a pull request
# that bumps "syscom" (with its CHANGELOG.md section) is all it takes. A pushed v* tag works too. Installed copies
# read feed.json from the latest release and update themselves (see docs/UPDATES.md). Manual runs only build the
# package and keep it as a workflow artifact.
on:
  push:
    branches: [main]
    paths: [versions.json]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version to release
        id: v
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content versions.json -Raw | ConvertFrom-Json).syscom
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and "v$v" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match versions.json ($v)"
          }
          gh release view "v$v" --repo $env:GITHUB_REPOSITORY *> $null
          $exists = $LASTEXITCODE -eq 0
          $publish = $env:GITHUB_EVENT_NAME -eq 'push' -and -not $exists
          $skip = $env:GITHUB_EVENT_NAME -eq 'push' -and $exists
          if ($skip) { Write-Host "Release v$v already exists; nothing to do." }
          "version=$v" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "skip=$($skip.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0

      - uses: actions/setup-dotnet@v6
        if: steps.v.outputs.skip != 'true'
        with:
          dotnet-version: 10.0.x

      - name: Build package
        if: steps.v.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./build/package.ps1 -Repository "${{ github.repository }}"

      - name: Publish release
        if: steps.v.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          # Release notes: this version's section of CHANGELOG.md.
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## \[$([regex]::Escape($env:VERSION))\][^\n]*\n(.*?)(?=^## \[|\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { 'See CHANGELOG.md.' }
          $notes += "`n`n---`n**New install:** download ``SYSCOM-$env:VERSION-win-x64.zip``, extract it and run ``install.ps1`` as administrator.`n"
          $notes += "**Installed PCs** update themselves within a few hours (tray app: Install updates automatically), or right away with **Update all** in the tray app."
          Set-Content notes.md $notes -Encoding utf8
          $files = Get-ChildItem dist -File | ForEach-Object FullName
          gh release create "v$env:VERSION" $files --target $env:GITHUB_SHA --title "SYSCOM $env:VERSION" --notes-file notes.md

      - name: Keep build output (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: syscom-package
          path: dist/*.*
