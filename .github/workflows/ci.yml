name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build server, updater and tray app (win-x64)
        shell: pwsh
        run: |
          foreach ($p in 'Syscom.Server', 'Syscom.Updater', 'Syscom.Tray') {
            dotnet build "src/$p" -c Release -r win-x64 -warnaserror
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*   # always the current LTS

      - name: Check web client syntax
        shell: pwsh
        run: Get-ChildItem web/js/*.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE) { exit 1 } }

      - name: API docs match the in-app reference
        run: node tools/api-docs.mjs --check

  update:
    # In-app update of an installed copy while its tray app runs: a build is updated through the management API to a
    # newer build served from a local feed. Windows doesn't let a running program's files be overwritten, so the
    # tray app's files are held open the same way; the updater must swap them, not roll the update back.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Update while the tray app runs, then restart
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $t = Join-Path $env:RUNNER_TEMP 'update-test'
          $inst = "$t\inst"; $new = "$t\new"; $feed = "$t\feed"; $cfg = "$t\config.json"
          New-Item -ItemType Directory -Force $inst, $new, $feed | Out-Null
          foreach ($p in 'Syscom.Server', 'Syscom.Updater', 'Syscom.Tray') {
            dotnet publish "src/$p" -c Release -r win-x64 --self-contained false -o $inst -p:SyscomVersion=0.0.1 -v q
            if ($LASTEXITCODE) { exit 1 }
            dotnet publish "src/$p" -c Release -r win-x64 --self-contained false -o $new -p:SyscomVersion=9.9.9 -v q
            if ($LASTEXITCODE) { exit 1 }
          }
          Copy-Item web "$inst\web" -Recurse
          Compress-Archive "$new\*" "$feed\app.zip"
          $sha = (Get-FileHash "$feed\app.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          @{ syscom = @{ version = '9.9.9'; url = 'http://127.0.0.1:8099/app.zip'; sha256 = $sha } } | ConvertTo-Json | Set-Content "$feed\feed.json"
          # The runner image's Python serves the local update feed.
          $feedServer = Start-Process python -ArgumentList '-m', 'http.server', '8099', '--bind', '127.0.0.1', '--directory', $feed -PassThru -WindowStyle Hidden
          @{ Port = 47830; HttpsPort = 47832; DiscoveryPort = 47831; UpdateFeedUrl = 'http://127.0.0.1:8099/feed.json'; AutoCheckUpdates = $false } |
            ConvertTo-Json | Set-Content $cfg

          # Windows opens a running program's files for reading with rename allowed, so they can't be overwritten.
          # (A held handle that allows renaming also allows deleting, which a running program's files don't.)
          $held = 'syscom-tray.exe', 'syscom-tray.dll' | ForEach-Object { [IO.File]::Open("$inst\$_", 'Open', 'Read', [IO.FileShare]'Read, Delete') }

          Start-Process dotnet -ArgumentList "`"$inst\syscom.dll`"", '--mock', '--config', "`"$cfg`"" -WorkingDirectory $inst -WindowStyle Hidden
          $api = 'http://127.0.0.1:47830/api'
          foreach ($i in 1..60) { try { Invoke-RestMethod "$api/health" | Out-Null; break } catch { Start-Sleep 1 } }
          $h = @{ 'X-Syscom-Admin' = (Get-Content "$env:ProgramData\SYSCOM\admin.key" -Raw).Trim() }
          function Wait-Result($since) {
            foreach ($i in 1..120) {
              try { $s = Invoke-RestMethod "$api/admin/status" -Headers $h; if ($s.lastUpdate -and [DateTimeOffset]$s.lastUpdate.time -gt $since) { return $s } } catch { }
              Start-Sleep 1
            }
            Get-Content "$env:ProgramData\SYSCOM\updates\*\updater.log"
            throw 'SYSCOM did not report back'
          }

          $since = [DateTimeOffset]::Now
          Invoke-RestMethod "$api/admin/components/check" -Method Post -Headers $h | Out-Null
          $outcome = Invoke-RestMethod "$api/admin/components/update" -Method Post -Headers $h -ContentType 'application/json' -Body '{"ids":["syscom"]}'
          $outcome | ConvertTo-Json -Compress
          if (-not $outcome.restarting) { throw 'expected a restart' }
          try {
            $again = Invoke-RestMethod "$api/admin/components/update" -Method Post -Headers $h -ContentType 'application/json' -Body '{"ids":["syscom"]}'
            if (-not $again.message.Contains('already')) { throw "a second click started another update: $($again.message)" }
          } catch [System.Net.Http.HttpRequestException] { Write-Host 'SYSCOM already stopped for the update' }
          $status = Wait-Result $since
          $log = Get-Content "$env:ProgramData\SYSCOM\updates\*\updater.log"
          $log
          $status.lastUpdate | ConvertTo-Json -Compress
          if (-not $status.lastUpdate.success -or $status.version -ne '9.9.9') { throw "update failed: $($status.lastUpdate.message)" }
          if (-not ($log -match 'Replaced in-use syscom-tray.dll')) { throw 'the held tray file was not swapped' }
          if ((Get-Item "$inst\syscom-tray.dll").VersionInfo.ProductVersion -notlike '9.9.9*') { throw 'the tray app was not replaced' }

          # The tray app exits; the next start of SYSCOM removes the old files.
          $held | ForEach-Object Dispose
          $since = [DateTimeOffset]::Now
          $r = Invoke-RestMethod "$api/admin/restart" -Method Post -Headers $h
          if (-not $r.restarting) { throw 'expected a restart' }
          Wait-Result $since | Out-Null
          Start-Sleep 2
          if (Get-ChildItem $inst -Filter '*.syscom-old') { throw 'old files were not cleaned up' }
          Stop-Process $feedServer -Force
          Get-Process dotnet -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host 'In-app update with the tray app running: OK'

      - name: Check PowerShell scripts
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem install/*.ps1, build/*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "$($f.Name):$($e.Extent.StartLineNumber): $($e.Message)"; $bad++ }
          }
          exit $bad

  installer:
    # Builds SYSCOM-Setup.exe the way a release does, installs it silently, checks the service, firewall, tray task,
    # Start menu, Installed apps entry and the API, upgrades over itself, then uninstalls and checks nothing is left.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build the package and the installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./build/package.ps1

      - name: Install, upgrade, uninstall
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem dist -Filter 'SYSCOM-Setup-*.exe').FullName
          "setup: $(Split-Path $setup -Leaf), $([math]::Round((Get-Item $setup).Length / 1MB, 1)) MB"
          $log = Join-Path $env:RUNNER_TEMP 'setup.log'
          $base = 'http://127.0.0.1:47810'
          function Install([string]$what) {
            $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=`"$log`"" -Wait -PassThru
            if ($p.ExitCode) { Get-Content $log -Tail 80; throw "$what failed: exit code $($p.ExitCode)" }
          }
          function Wait-Healthy {
            foreach ($i in 1..60) { try { return Invoke-RestMethod "$base/api/health" } catch { Start-Sleep 1 } }
            Get-Content $log -Tail 80
            throw 'SYSCOM does not answer after setup'
          }

          Install 'Setup'
          "health: $(Wait-Healthy | ConvertTo-Json -Compress)"
          Get-Content $log | Select-String ' -> ' | ForEach-Object { "  $($_.Line.Substring([Math]::Min(24, $_.Line.Length)))" }
          $svc = Get-CimInstance Win32_Service -Filter "Name='SYSCOM'"
          "service: $($svc.State), $($svc.StartMode), $($svc.PathName)"
          if ($svc.State -ne 'Running' -or $svc.StartMode -ne 'Auto' -or $svc.PathName -ne "`"$env:ProgramFiles\SYSCOM\syscom.exe`"") { throw 'service not set up right' }
          $task = Get-ScheduledTask -TaskName 'SYSCOM Tray' -ErrorAction SilentlyContinue
          if (-not $task) { throw 'tray task missing' }
          "tray task: $($task.Principal.GroupId), $($task.Principal.RunLevel), on battery: $(-not $task.Settings.DisallowStartIfOnBatteries), $($task.Actions[0].Execute)"
          if ($task.Principal.RunLevel -ne 'Highest' -or $task.Settings.DisallowStartIfOnBatteries) { throw 'tray task settings' }
          $rules = @(Get-NetFirewallRule -DisplayName 'SYSCOM*' | ForEach-Object DisplayName)
          "firewall: $($rules -join ', ')"
          if ($rules -notcontains 'SYSCOM dashboard' -or $rules -notcontains 'SYSCOM discovery') { throw 'firewall rules missing' }
          $menu = Join-Path ([Environment]::GetFolderPath('CommonPrograms')) 'SYSCOM'
          "start menu: $((Get-ChildItem $menu).Name -join ', ')"
          if (-not (Test-Path "$menu\SYSCOM.lnk") -or -not (Test-Path "$menu\SYSCOM dashboard.url")) { throw 'Start menu entries missing' }
          $entry = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{6B0E9B0C-5E1F-4C1D-9D57-6A3C2F1E8B47}_is1'
          "installed apps: $($entry.DisplayName) $($entry.DisplayVersion) by $($entry.Publisher)"
          $pawn = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\PawnIO' -ErrorAction SilentlyContinue
          "PawnIO: $(if ($pawn) { $pawn.DisplayVersion } else { 'not installed' })"

          # The API on the installed copy: sign in with the first password, make a read key, read with it.
          $pw = (Get-Content "$env:ProgramData\SYSCOM\initial-password.txt" -Raw).Trim()
          $token = (Invoke-RestMethod "$base/api/login" -Method Post -ContentType 'application/json' -Body (@{ password = $pw } | ConvertTo-Json)).token
          $key = (Invoke-RestMethod "$base/api/keys" -Method Post -Headers @{ Authorization = "Bearer $token" } -ContentType 'application/json' -Body '{"name":"ci","access":"read"}').secret
          $cats = Invoke-RestMethod "$base/api/categories" -Headers @{ 'X-API-Key' = $key }
          "sensors by category: $(($cats | ForEach-Object { "$($_.id) $($_.count)" }) -join ', ')"

          # How light it is: CPU and memory idle, and with a dashboard streaming every sensor at 1 s and 500 ms. For
          # comparison, LibreHardwareMonitor's own app (the same sensor library, with its window), latest release.
          $compare = @()
          try {
            $rel = Invoke-RestMethod 'https://api.github.com/repos/LibreHardwareMonitor/LibreHardwareMonitor/releases/latest' -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'SYSCOM-ci' }
            foreach ($a in @($rel.assets | Where-Object name -like '*.zip' | Sort-Object { $_.name -match 'net4|framework' })) {
              $zip = Join-Path $env:RUNNER_TEMP $a.name
              Invoke-WebRequest $a.browser_download_url -OutFile $zip -UseBasicParsing
              if ($a.digest -like 'sha256:*' -and (Get-FileHash $zip).Hash -ne $a.digest.Substring(7).ToUpperInvariant()) { throw "checksum mismatch: $($a.name)" }
              $dir = Join-Path $env:RUNNER_TEMP ('lhm-' + [IO.Path]::GetFileNameWithoutExtension($a.name))
              Expand-Archive $zip $dir -Force
              $exe = Get-ChildItem $dir -Recurse -Filter LibreHardwareMonitor.exe | Select-Object -First 1
              if ($exe) { $compare = @($exe.FullName); "comparing with LibreHardwareMonitor $($rel.tag_name) ($($a.name))"; break }
            }
          } catch { Write-Warning "LibreHardwareMonitor is not available for the comparison: $_" }
          ./build/benchmark.ps1 -Password $pw -Seconds 30 -Compare $compare -Markdown | Tee-Object -Variable bench
          @('## SYSCOM resource use on the CI runner', '') + $bench | Add-Content $env:GITHUB_STEP_SUMMARY

          Install 'Upgrade over the installed copy'
          Wait-Healthy | Out-Null
          Invoke-RestMethod "$base/api/categories" -Headers @{ 'X-API-Key' = $key } | Out-Null   # keys and settings survive
          'upgrade: OK'

          $p = Start-Process "$env:ProgramFiles\SYSCOM\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode) { throw "uninstall failed: exit code $($p.ExitCode)" }
          foreach ($i in 1..30) { if (-not (Test-Path "$env:ProgramFiles\SYSCOM")) { break }; Start-Sleep 1 }
          if (Get-Service SYSCOM -ErrorAction SilentlyContinue) { throw 'the service is still there' }
          if (Get-ScheduledTask -TaskName 'SYSCOM Tray' -ErrorAction SilentlyContinue) { throw 'the tray task is still there' }
          if (Get-NetFirewallRule -DisplayName 'SYSCOM*' -ErrorAction SilentlyContinue) { throw 'firewall rules are still there' }
          if (Test-Path "$env:ProgramFiles\SYSCOM") { Get-ChildItem "$env:ProgramFiles\SYSCOM" -Recurse | Select-Object -First 20 FullName; throw 'the install folder is still there' }
          if (Test-Path $menu) { throw 'the Start menu folder is still there' }
          if (-not (Test-Path "$env:ProgramData\SYSCOM\config.json")) { throw 'a silent uninstall should keep the settings' }
          'Setup, upgrade and uninstall: OK'

      - name: Keep the setup log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: setup-log
          path: ${{ runner.temp }}/setup.log
          if-no-files-found: ignore

  smoke:
    # Starts the server with mock sensors on Linux and checks the public endpoints.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*   # a WebSocket client for the shutdown check
      - name: Run server and probe it
        run: |
          dotnet build src/Syscom.Server -c Release
          dotnet src/Syscom.Server/bin/Release/net10.0/syscom.dll --mock --config "$RUNNER_TEMP/cfg/config.json" &
          SERVER=$!
          for i in $(seq 1 30); do curl -sf localhost:47810/api/health && break; sleep 1; done
          curl -sf localhost:47810/api/info
          curl -sf localhost:47810/ | grep -q "<title>SYSCOM</title>"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:47810/api/sensors)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:47810/api/dashboard)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:47810/api/history?sensor=x')" = "401"
          # Signed in: save and read back a dashboard, read a sensor's history
          PW=$(cat "$HOME/.config/SYSCOM/initial-password.txt")
          TOKEN=$(curl -sf localhost:47810/api/login -H 'content-type: application/json' -d "{\"password\":\"$PW\"}" | jq -r .token)
          curl -sf -X PUT localhost:47810/api/dashboard -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d '{"widgets":[{"id":"s1","kind":"section","title":"CPU"},{"id":"w1","sensor":"/mock/cpu/load/0","type":"gauge","w":2,"h":3}]}' | jq -e '.rev == 1'
          curl -sf localhost:47810/api/dashboard -H "authorization: Bearer $TOKEN" | jq -e '.widgets | length == 2'
          sleep 3
          curl -sf 'localhost:47810/api/history?sensor=/mock/cpu/load/0&days=1' -H "authorization: Bearer $TOKEN" | jq -e '.step == 60 and (.avg | length) == 1440 and (.avg[-1] != null or .avg[-2] != null)'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:47810/api/admin/components)" = "403"
          # Sign-ins renew; the device list and background are kept on the PC; the relay refuses unknown PCs and admin paths
          curl -sf -X POST localhost:47810/api/token -H "authorization: Bearer $TOKEN" | jq -e '(.token | length) > 20 and .expiresInDays == 30'
          curl -sf -X PUT localhost:47810/api/devices -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d '{"devices":[{"id":"0123456789abcdef","name":"Other PC","url":"http://192.168.1.20:47810","httpsPort":47812}]}' | jq -e '.rev == 1'
          curl -sf localhost:47810/api/devices -H "authorization: Bearer $TOKEN" | jq -e '.devices[0].name == "Other PC"'
          curl -sf -X PUT localhost:47810/api/dashboard/background -H "authorization: Bearer $TOKEN" -H 'content-type: image/png' \
            --data-binary @web/icons/icon-192.png | jq -e '(.id | length) == 16'
          test "$(curl -s -o /dev/null -w '%{content_type}' localhost:47810/api/dashboard/background -H "authorization: Bearer $TOKEN")" = "image/png"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:47810/relay/unknown/api/info)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:47810/relay/0123456789abcdef/api/admin/status)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:47810/relay/127.0.0.1-47810/api/info)" = "404"
          curl -sf localhost:47810/trust | grep -q "Install SYSCOM as an app"
          # API keys: a read key reads sensors and cards but can't change anything; a revoked key stops at once
          KEY=$(curl -sf localhost:47810/api/keys -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' -d '{"name":"ci","access":"read"}')
          SECRET=$(echo "$KEY" | jq -r .secret); KID=$(echo "$KEY" | jq -r .key.id)
          curl -sf 'localhost:47810/api/sensors?category=cpu&kind=load' -H "X-API-Key: $SECRET" | jq -e 'length >= 1 and .[0].value != null'
          curl -sf localhost:47810/api/widgets/w1 -H "X-API-Key: $SECRET" | jq -e '.widget.sensor.id == "/mock/cpu/load/0" and .widget.unit == "%" and .widget.value != null'
          curl -sf localhost:47810/api/sections/s1 -H "X-API-Key: $SECRET" | jq -e '.section.title == "CPU" and (.section.widgets | length) == 1'
          curl -sf localhost:47810/api/dashboard/readings -H "X-API-Key: $SECRET" | jq -e '(.sections | length) == 1'
          curl -sf 'localhost:47810/api/values?ids=/mock/cpu/load/0' -H "authorization: Bearer $SECRET" | jq -e '.values["/mock/cpu/load/0"] != null'
          curl -sf "localhost:47810/api/sensors/mock/cpu/load/0?key=$SECRET" | jq -e '.name == "CPU Total"'
          curl -sf localhost:47810/api/categories -H "X-API-Key: $SECRET" | jq -e 'map(.id) | index("cpu") != null'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT localhost:47810/api/dashboard -H "X-API-Key: $SECRET" -H 'content-type: application/json' -d '{"widgets":[]}')" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:47810/api/keys -H "X-API-Key: $SECRET")" = "401"
          # A full-access key can change what the dashboard can: the layout, the background picture, the list of PCs
          FULL=$(curl -sf localhost:47810/api/keys -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' -d '{"name":"ci full","access":"full"}' | jq -r .secret)
          curl -sf localhost:47810/api/dashboard -H "X-API-Key: $FULL" | jq -c '{widgets, phone, look, saved, current}' > "$RUNNER_TEMP/dash.json"
          curl -sf -X PUT localhost:47810/api/dashboard -H "X-API-Key: $FULL" -H 'content-type: application/json' --data-binary @"$RUNNER_TEMP/dash.json" | jq -e '.rev == 2'
          curl -sf -X PUT localhost:47810/api/dashboard/background -H "X-API-Key: $FULL" -H 'content-type: image/png' --data-binary @web/icons/icon-192.png | jq -e '(.id | length) == 16'
          curl -sf -X DELETE localhost:47810/api/dashboard/background -H "X-API-Key: $FULL" > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:47810/api/dashboard/background -H "X-API-Key: $SECRET")" = "404"
          curl -sf -X PUT localhost:47810/api/devices -H "X-API-Key: $FULL" -H 'content-type: application/json' -d '{"devices":[]}' | jq -e '.rev == 2'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:47810/api/keys -H "X-API-Key: $FULL")" = "401"
          curl -sf -X DELETE "localhost:47810/api/keys/$KID" -H "authorization: Bearer $TOKEN" > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:47810/api/values -H "X-API-Key: $SECRET")" = "401"
          # Several refresh rates on one WebSocket (cards with their own polling interval)
          node -e '
            const ws = new WebSocket(process.argv[1]); const n = {};
            ws.onopen = () => ws.send(JSON.stringify({ type: "subscribe", interval: 1000, streams: [
              { id: 500, interval: 500, sensors: ["/mock/cpu/load/0"] }, { id: 2000, interval: 2000, sensors: ["/mock/gpu/load/0"] }] }));
            ws.onmessage = (e) => { const m = JSON.parse(e.data); if (m.type === "data") n[m.s] = (n[m.s] || 0) + 1; };
            setTimeout(() => { console.log("frames in 4 s", JSON.stringify(n)); process.exit(n[500] >= 6 && n[500] <= 10 && n[2000] >= 1 && n[2000] <= 3 ? 0 : 1); }, 4000);' \
            "ws://localhost:47810/ws?token=$TOKEN"
          # HTTPS with the server's own CA (name-constrained to local names and private addresses)
          curl -sf localhost:47810/tls/syscom-ca.crt -o "$RUNNER_TEMP/ca.der"
          openssl x509 -inform der -in "$RUNNER_TEMP/ca.der" -out "$RUNNER_TEMP/ca.pem"
          curl -sf --cacert "$RUNNER_TEMP/ca.pem" https://localhost:47812/api/health
          curl -sf localhost:47810/tls/syscom.mobileconfig | grep -q "com.apple.security.root"
          # Stopping with a dashboard connected must not wait for it: the Windows service would run into its 30 s
          # shutdown limit and crash. The dashboard is told the server is going away (1001) and reconnects.
          node -e 'const ws = new WebSocket(process.argv[1]); ws.onopen = () => console.log("dashboard connected"); ws.onclose = (e) => { console.log("closed", e.code); process.exit(e.code === 1001 ? 0 : 1); }; setTimeout(() => process.exit(2), 60000);' \
            "ws://localhost:47810/ws?token=$TOKEN" &
          CLIENT=$!
          sleep 2
          START=$(date +%s%N)
          kill -TERM $SERVER
          while kill -0 $SERVER 2>/dev/null; do sleep 0.1; done
          MS=$(( ($(date +%s%N) - START) / 1000000 ))
          echo "server stopped in $MS ms"
          test $MS -lt 5000
          wait $CLIENT
